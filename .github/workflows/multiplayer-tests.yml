name: Multiplayer automation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 5"

permissions:
  contents: read

concurrency:
  group: multiplayer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    name: L0/L1 deterministic tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run fast automation tests
        shell: pwsh
        run: ./scripts/Test-Multiplayer.ps1 -Mode fast

  api-multiplayer:
    name: L2 headless Direct, Relay, compatibility, and session lifecycle
    needs: deterministic-tests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SC_TEST_ARTIFACTS: ${{ github.workspace }}\TestResults\l2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build ANGLE-compatible game runtime
        shell: pwsh
        run: dotnet build ./Survivalcraft.Test/Survivalcraft.Test.csproj --nologo -c Debug -m:1 -p:UseAngle=true
      - name: Build automation host
        shell: pwsh
        run: dotnet build ./Survivalcraft.TestHost/Survivalcraft.TestHost.csproj --nologo -c Debug
      - name: Verify coverage contract and production-surface inventory
        shell: pwsh
        run: >-
          dotnet run --project ./Survivalcraft.TestHost/Survivalcraft.TestHost.csproj
          --no-build -c Debug -- coverage
          --output ./TestResults/coverage-trust.json
      - name: Verify headless runtime and control channel
        shell: pwsh
        run: dotnet run --project ./Survivalcraft.TestHost/Survivalcraft.TestHost.csproj --no-build -c Debug -- doctor --startup-timeout 120
      - name: Run all headless L2 acceptance tests
        shell: pwsh
        run: >-
          dotnet test ./Survivalcraft.Test/Survivalcraft.Test.csproj
          --nologo -c Debug --no-build
          --filter "Layer=L2"
          --logger "trx;LogFileName=api-multiplayer-l2.trx"
          --results-directory ./TestResults/trx
      - name: Upload replayable diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-multiplayer-l2-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  l3-soak:
    name: L3 replayable multiplayer soak
    if: github.event_name == 'schedule'
    needs: api-multiplayer
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SC_TEST_ARTIFACTS: ${{ github.workspace }}\TestResults\l3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run full replayable fault rotation headlessly
        shell: pwsh
        run: >-
          ./scripts/Test-Multiplayer.ps1
          -Mode soak
          -UseAngle
          -SoakIterations 10
          -SoakTransport direct
          -Artifacts ./TestResults/l3
      - name: Upload replayable soak evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-multiplayer-l3-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults
          if-no-files-found: error
          retention-days: 30
