name: Multiplayer automation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 5"

permissions:
  contents: read

concurrency:
  group: multiplayer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    name: L0/L1 deterministic tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run fast automation tests
        shell: pwsh
        run: ./scripts/Test-Multiplayer.ps1 -Mode fast

  core-multiplayer:
    name: L2 real-process multiplayer
    needs: deterministic-tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SC_TEST_ARTIFACTS: ${{ github.workspace }}\TestResults\l2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build ANGLE-compatible game runtime
        shell: pwsh
        run: dotnet build ./Survivalcraft.Test/Survivalcraft.Test.csproj --nologo -c Debug -p:UseAngle=true
      - name: Build automation host
        shell: pwsh
        run: dotnet build ./Survivalcraft.TestHost/Survivalcraft.TestHost.csproj --nologo -c Debug
      - name: Verify headless runtime and control channel
        shell: pwsh
        run: dotnet run --project ./Survivalcraft.TestHost/Survivalcraft.TestHost.csproj --no-build -c Debug -- doctor --startup-timeout 120
      - name: Run core multiplayer acceptance test
        shell: pwsh
        run: >-
          dotnet test ./Survivalcraft.Test/Survivalcraft.Test.csproj
          --nologo -c Debug --no-build
          --filter "Layer=L2"
          --logger "trx;LogFileName=core-multiplayer.trx"
          --results-directory ./TestResults/trx
      - name: Upload replayable diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-multiplayer-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults
          if-no-files-found: warn
          retention-days: 14
